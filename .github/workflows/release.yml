name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    container:
      image: ghcr.io/${{ github.repository_owner }}/binrunner-sdk:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check tag matches __version__
        # 防 v1.1.0 事故：忘升 __version__ 导致 wheel 版本与 tag 不符（#1）
        run: |
          tag="${{ github.ref_name }}"
          tag_ver="${tag#v}"
          pkg_ver=$(python -c "from binrunner import __version__; print(__version__)")
          echo "tag=${tag_ver}  __version__=${pkg_ver}"
          if [ "$tag_ver" != "$pkg_ver" ]; then
            echo "::error::tag ${tag} 与 binrunner.__version__ (${pkg_ver}) 不一致，先升 binrunner/__init__.py 的版本号再发版"
            exit 1
          fi

      - name: Build wheel
        env:
          BINRUNNER_KEYSTORE_B64: ${{ secrets.BINRUNNER_KEYSTORE_B64 }}
          BINRUNNER_PROFILE_B64: ${{ secrets.BINRUNNER_PROFILE_B64 }}
          BINRUNNER_CERT_B64: ${{ secrets.BINRUNNER_CERT_B64 }}
          KEYSTORE_PWD: ${{ secrets.BINRUNNER_KEYSTORE_PWD }}
          KEY_ALIAS: ${{ secrets.BINRUNNER_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.BINRUNNER_KEY_PWD }}
        run: |
          # 确保 SDK toolchain 在 PATH（setup-python 可能覆盖容器 PATH）
          export PATH="/opt/command-line-tools/bin:/opt/command-line-tools/hvigor/bin:/opt/harmonyos-sdk/default/openharmony/native/llvm/bin:/opt/harmonyos-sdk/default/openharmony/toolchains:$PATH"
          echo "PATH=$PATH"
          which aarch64-unknown-linux-ohos-clang
          bash build.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: binrunner-wheel
          path: dist/*.whl

      - name: Extract current-version section as release body
        # RELEASE.md 是累计变更记录（含历史版本）；Release 正文只取顶部当前版本一节，
        # 到下一个 '# vX.Y.Z' 版本标题为止，避免把全部历史描述塞进单个 Release。
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('RELEASE.md').read_text(encoding='utf-8').splitlines(keepends=True)
          body, seen_version_heading = [], False
          for line in lines:
              if line.startswith('# '):
                  if seen_version_heading:
                      break
                  seen_version_heading = True
              if seen_version_heading:
                  body.append(line)
          Path('release-body.md').write_text(''.join(body), encoding='utf-8')
          PY
          head -n 1 release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          body_path: release-body.md